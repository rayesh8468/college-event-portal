version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Write AWS credentials to lib/aws-config.json (bundled by Next.js)
        - printf '{"accessKeyId":"%s","secretAccessKey":"%s","region":"%s"}\n' "$AMAZON_ACCESS_KEY_ID" "$AMAZON_SECRET_ACCESS_KEY" "$AMAZON_REGION" > lib/aws-config.json
        - cat lib/aws-config.json
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
